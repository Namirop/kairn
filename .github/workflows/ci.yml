name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push on the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `prisma generate` reads prisma.config.ts, which requires this variable even
  # though no database is reached. A placeholder is enough.
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  checks:
    name: Lint, types, format, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Not `npm run build`: that one also runs `prisma migrate deploy`.
      - run: npx next build --turbopack
        env:
          MOCK_AI: "true"
